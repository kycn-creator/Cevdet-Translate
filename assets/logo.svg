<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#0d111a"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="25%" stop-color="#E5BE64"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="75%" stop-color="#F3D37A"/>
      <stop offset="100%" stop-color="#9A741A"/>
    </linearGradient>

    <!-- Cyan/Blue Tech Gradient -->
    <linearGradient id="techBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#38D9A9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Cinzel', 'Times New Roman', serif; font-weight: 800; font-size: 52px; fill: url(#goldGrad); letter-spacing: 5px; }
    .title-sub { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 38px; fill: url(#techBlue); letter-spacing: 4px; }
    .tagline { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 400; font-size: 15px; fill: #8B949E; letter-spacing: 2px; }
    .badge-text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #121826; }
  </style>

  <!-- Background Card -->
  <rect width="960" height="260" rx="20" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- Subtle Decorative Geometric Motif (Ottoman Arch Hint) -->
  <path d="M 820 30 C 880 30 920 70 920 130 C 920 190 880 230 820 230" fill="none" stroke="rgba(212, 168, 83, 0.08)" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 850 50 C 895 50 925 85 925 130 C 925 175 895 210 850 210" fill="none" stroke="rgba(88, 166, 255, 0.06)" stroke-width="2"/>

  <!-- EMBLEM / ICON (Left) -->
  <g transform="translate(60, 40)">
    <!-- Outer Octagonal Star / Seljuk Knot Motif -->
    <rect x="0" y="0" width="180" height="180" rx="36" fill="#161F30" stroke="url(#goldGrad)" stroke-width="2.5" />
    <rect x="10" y="10" width="160" height="160" rx="28" fill="#0E1420" stroke="rgba(212, 168, 83, 0.3)" stroke-width="1" />

    <!-- Radiant Glow Ring -->
    <circle cx="90" cy="90" r="58" fill="none" stroke="url(#techBlue)" stroke-width="1.5" stroke-dasharray="8,5" opacity="0.7"/>

    <!-- Stylized Ottoman Calligraphic Crescent "C" & Reed Pen (Divit) -->
    <!-- The Crescent Form -->
    <path d="M 125 58 C 72 54 48 88 56 126 C 63 154 94 168 126 150 C 98 160 74 146 70 122 C 65 96 86 72 125 58 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- The Quill / Divit Nib (Golden Pen) -->
    <path d="M 118 64 L 142 40 C 146 36 152 36 156 40 L 162 46 C 166 50 166 56 162 60 L 138 84 Z" fill="url(#goldGrad)" />
    <!-- Nib Tip Writing Line -->
    <path d="M 118 64 L 110 72 L 126 88 L 134 80 Z" fill="#FFF2A3" />
    <path d="M 110 72 L 95 87 L 105 97 L 120 82 Z" fill="url(#techBlue)" opacity="0.8"/>

    <!-- Neural / Digital Translation Wave Lines -->
    <circle cx="128" cy="115" r="3.5" fill="#58A6FF"/>
    <circle cx="145" cy="102" r="3" fill="#38D9A9"/>
    <circle cx="140" cy="130" r="2.5" fill="#E5BE64"/>
    <line x1="128" y1="115" x2="145" y2="102" stroke="#58A6FF" stroke-width="1" opacity="0.6"/>
    <line x1="128" y1="115" x2="140" y2="130" stroke="#E5BE64" stroke-width="1" opacity="0.6"/>

    <!-- Diacritic Point / Star (Ottoman Calligraphy Diamond) -->
    <polygon points="90,44 95,50 90,56 85,50" fill="url(#goldGrad)"/>
  </g>

  <!-- BRAND TYPOGRAPHY (Right) -->
  <g transform="translate(280, 100)">
    <!-- Main Title -->
    <text x="0" y="0" class="title-main">CEVDET</text>
    <text x="260" y="0" class="title-sub">-TRANSLATE</text>

    <!-- Version Badge -->
    <rect x="585" y="-34" width="76" height="28" rx="6" fill="url(#goldGrad)"/>
    <text x="597" y="-15" class="badge-text">v1.0.0</text>

    <!-- Divider Line with Gradient -->
    <line x1="0" y1="22" x2="620" y2="22" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7"/>
    <line x1="620" y1="22" x2="660" y2="22" stroke="url(#techBlue)" stroke-width="2" opacity="0.9"/>

    <!-- Tagline -->
    <text x="0" y="55" class="tagline">OSMANLICA METİN VE BELGE YAPAY ZEKÂ ÇEVİRİ SİSTEMİ</text>
    <text x="0" y="82" font-family="'Inter', sans-serif" font-size="13" fill="#58A6FF" opacity="0.9">
      Ahmet Cevdet Paşa'nın İlmi Mirasından &bull; TrOCR Göz &bull; Qwen2.5 Beyin &bull; 10K Sözlük
    </text>
  </g>
</svg>
